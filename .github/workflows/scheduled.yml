name: Scheduled jobs

# The free host sleeps when nobody is using the app, so it cannot run its own
# daily jobs. This wakes it and starts them. Times are UTC (Pakistan is UTC+5).
on:
  schedule:
    - cron: "0 2 * * *" # every day, 7 am in Pakistan: overdue check and reminders
    - cron: "0 1 1 * *" # first of the month, 6 am in Pakistan: monthly invoices
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [overdue-check, monthly-invoices]
        default: overdue-check

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Start the job
        if: env.SITE_URL != '' && env.CRON_SECRET != ''
        run: |
          JOB="${{ inputs.job }}"
          if [ -z "$JOB" ]; then
            if [ "${{ github.event.schedule }}" = "0 1 1 * *" ]; then JOB=monthly-invoices; else JOB=overdue-check; fi
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --max-time 600 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/internal/jobs/$JOB/"
